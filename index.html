
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<title>Jardin-Verger de Pardaillan</title>
<style>
/* Jardin-Verger de Pardaillan — Design system */
:root {
  --green-900: #1a3a1a;
  --green-800: #2d5a2d;
  --green-700: #3d6b3d;
  --green-600: #4a7c4a;
  --green-500: #5c820d;
  --green-400: #6b9a1f;
  --green-100: #e8f0e0;
  --green-50: #f4f8ef;
  --cream: #faf9f6;
  --white: #ffffff;
  --gray-100: #f3f4f6;
  --gray-200: #e5e7eb;
  --gray-500: #6b7280;
  --gray-700: #374151;
  --gray-900: #111827;
  --shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 12px rgba(0,0,0,.04);
  --shadow-lg: 0 4px 20px rgba(0,0,0,.08);
  --radius: 12px;
  --radius-sm: 8px;
  --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font);
  background: var(--cream);
  color: var(--gray-900);
  line-height: 1.5;
  min-height: 100vh;
}

a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }
button, input, select { font: inherit; }

/* Header */
.site-header {
  background: var(--green-900);
  color: white;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: var(--shadow);
}

.header-inner {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 1.25rem;
  display: flex;
  align-items: center;
  gap: 1.5rem;
  height: 60px;
}

.logo {
  display: flex;
  align-items: center;
  gap: .5rem;
  font-weight: 700;
  font-size: 1.05rem;
  white-space: nowrap;
}
.logo-icon {
  width: 28px; height: 28px;
  background: var(--green-500);
  border-radius: 50%;
  display: grid; place-items: center;
  font-size: 14px;
}

.nav {
  display: flex;
  gap: .25rem;
  flex: 1;
  overflow-x: auto;
}
.nav a {
  padding: .4rem .85rem;
  border-radius: 999px;
  font-size: .9rem;
  opacity: .85;
  white-space: nowrap;
  transition: .15s;
}
.nav a:hover, .nav a.active {
  background: rgba(255,255,255,.15);
  opacity: 1;
}
.nav a.active { font-weight: 600; }

.search-box {
  display: flex;
  background: rgba(255,255,255,.12);
  border-radius: 999px;
  padding: .35rem .75rem;
  align-items: center;
  gap: .4rem;
  min-width: 180px;
}
.search-box input {
  background: transparent;
  border: none;
  outline: none;
  color: white;
  width: 100%;
  font-size: .875rem;
}
.search-box input::placeholder { color: rgba(255,255,255,.55); }

/* Layout */
.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 1.5rem 1.25rem 3rem;
}

/* Hero */
.hero {
  position: relative;
  border-radius: var(--radius);
  overflow: hidden;
  min-height: 320px;
  background: linear-gradient(135deg, var(--green-800), var(--green-500));
  color: white;
  margin-bottom: 2rem;
  display: flex;
  align-items: flex-end;
}
.hero-bg {
  position: absolute; inset: 0;
  background: url('https://images.unsplash.com/photo-1464226184884-fa280b87c399?w=1400&q=80') center/cover;
  opacity: .45;
}
.hero-content {
  position: relative;
  z-index: 1;
  padding: 2rem 2.25rem;
  width: 100%;
  background: linear-gradient(transparent, rgba(0,0,0,.55));
}
.hero h1 {
  font-size: clamp(1.75rem, 4vw, 2.5rem);
  font-weight: 700;
  margin-bottom: .35rem;
}
.hero p { opacity: .9; font-size: 1.1rem; margin-bottom: 1.25rem; }

.stats-row {
  display: flex;
  flex-wrap: wrap;
  gap: .75rem;
}
.stat-badge {
  background: rgba(255,255,255,.95);
  color: var(--green-900);
  padding: .55rem 1rem;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  gap: .5rem;
  font-weight: 600;
  font-size: .95rem;
  box-shadow: var(--shadow);
}
.stat-badge span { color: var(--green-500); font-size: 1.25rem; font-weight: 700; }

/* Cards */
.section-title {
  font-size: 1.35rem;
  font-weight: 700;
  color: var(--green-900);
  margin-bottom: 1rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
}
.section-title a {
  font-size: .9rem;
  font-weight: 500;
  color: var(--green-500);
}
.section-title a:hover { text-decoration: underline; }

.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 1.1rem;
}

.card {
  background: var(--white);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
  transition: transform .15s, box-shadow .15s;
  border: 1px solid var(--gray-200);
}
.card:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-lg);
}
.card-img {
  aspect-ratio: 4/3;
  object-fit: cover;
  width: 100%;
  background: var(--green-100);
}
.card-body { padding: 1rem; }
.card-body h3 {
  font-size: 1rem;
  font-weight: 650;
  color: var(--green-900);
  margin-bottom: .15rem;
}
.card-body .sci {
  font-style: italic;
  color: var(--gray-500);
  font-size: .8rem;
  margin-bottom: .5rem;
}
.card-meta {
  display: flex;
  align-items: center;
  gap: .5rem;
  font-size: .8rem;
  color: var(--gray-500);
}

/* Explorer layout */
.explorer-layout {
  display: grid;
  grid-template-columns: 260px 1fr;
  gap: 1.5rem;
  align-items: start;
}
@media (max-width: 800px) {
  .explorer-layout { grid-template-columns: 1fr; }
}

.sidebar {
  background: var(--white);
  border-radius: var(--radius);
  padding: 1.25rem;
  box-shadow: var(--shadow);
  border: 1px solid var(--gray-200);
  position: sticky;
  top: 76px;
}
.sidebar h2 {
  font-size: .95rem;
  color: var(--green-900);
  margin-bottom: 1rem;
  display: flex;
  align-items: center;
  gap: .4rem;
}

.tree-item {
  display: flex;
  align-items: center;
  gap: .5rem;
  padding: .4rem .55rem;
  border-radius: 6px;
  font-size: .875rem;
  cursor: pointer;
  color: var(--gray-700);
}
.tree-item:hover, .tree-item.active {
  background: var(--green-100);
  color: var(--green-900);
  font-weight: 600;
}
.tree-item .count {
  margin-left: auto;
  background: var(--green-50);
  color: var(--green-700);
  font-size: .75rem;
  font-weight: 600;
  padding: .1rem .45rem;
  border-radius: 999px;
}
.tree-children { padding-left: 1rem; border-left: 2px solid var(--green-100); margin-left: .6rem; }

.help-box {
  margin-top: 1.25rem;
  padding: .9rem;
  background: var(--green-50);
  border-radius: var(--radius-sm);
  font-size: .8rem;
  color: var(--gray-700);
}
.help-box strong { display: block; margin-bottom: .3rem; color: var(--green-800); }

/* Group cards */
.group-cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 1.1rem;
  margin-top: 1.25rem;
}
.group-card {
  background: white;
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
  border: 1px solid var(--gray-200);
  transition: .15s;
}
.group-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.group-card img { width: 100%; aspect-ratio: 16/10; object-fit: cover; }
.group-card .body { padding: 1rem 1.1rem 1.2rem; }
.group-card h3 { font-size: 1.15rem; color: var(--green-900); margin-bottom: .35rem; }
.group-card p { font-size: .875rem; color: var(--gray-500); margin-bottom: .75rem; }
.group-card .footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: .85rem;
}
.btn {
  display: inline-flex;
  align-items: center;
  gap: .35rem;
  padding: .45rem .9rem;
  border-radius: 999px;
  border: none;
  cursor: pointer;
  font-weight: 600;
  font-size: .85rem;
  transition: .15s;
}
.btn-primary {
  background: var(--green-500);
  color: white;
}
.btn-primary:hover { background: var(--green-600); }
.btn-outline {
  background: transparent;
  border: 1.5px solid var(--green-500);
  color: var(--green-700);
}
.btn-outline:hover { background: var(--green-50); }
.btn-ghost {
  background: var(--green-50);
  color: var(--green-700);
}

/* Filters bar */
.filters-bar {
  display: flex;
  flex-wrap: wrap;
  gap: .6rem;
  align-items: center;
  margin: 1rem 0 1.25rem;
  padding: .85rem 1rem;
  background: white;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  border: 1px solid var(--gray-200);
}
.chip {
  display: inline-flex;
  align-items: center;
  gap: .35rem;
  padding: .35rem .75rem;
  border-radius: 999px;
  background: var(--green-50);
  color: var(--green-800);
  font-size: .85rem;
  font-weight: 500;
  border: 1px solid transparent;
  cursor: pointer;
}
.chip.active, .chip:hover {
  background: var(--green-100);
  border-color: var(--green-400);
}
.chip .n {
  background: white;
  padding: 0 .4rem;
  border-radius: 999px;
  font-weight: 700;
  font-size: .75rem;
}

/* KPI dashboard */
.kpi-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 1rem;
  margin-bottom: 1.5rem;
}
.kpi {
  background: white;
  border-radius: var(--radius);
  padding: 1.15rem 1.25rem;
  box-shadow: var(--shadow);
  border: 1px solid var(--gray-200);
}
.kpi .label { font-size: .8rem; color: var(--gray-500); margin-bottom: .25rem; }
.kpi .value { font-size: 1.75rem; font-weight: 700; color: var(--green-900); }
.kpi .sub { font-size: .75rem; color: var(--green-500); margin-top: .15rem; }

.panel {
  background: white;
  border-radius: var(--radius);
  padding: 1.25rem;
  box-shadow: var(--shadow);
  border: 1px solid var(--gray-200);
  margin-bottom: 1.25rem;
}
.panel h3 {
  font-size: 1rem;
  color: var(--green-900);
  margin-bottom: 1rem;
}

.charts-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 1.25rem;
}

/* Species page */
.species-hero {
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  gap: 1.5rem;
  margin-bottom: 1.5rem;
}
@media (max-width: 768px) {
  .species-hero { grid-template-columns: 1fr; }
}
.species-hero img {
  width: 100%;
  border-radius: var(--radius);
  aspect-ratio: 4/3;
  object-fit: cover;
  box-shadow: var(--shadow);
}
.species-info h1 {
  font-size: 1.85rem;
  color: var(--green-900);
  margin-bottom: .15rem;
}
.species-info .common {
  font-size: 1.25rem;
  color: var(--green-600);
  margin-bottom: .75rem;
}
.tags { display: flex; flex-wrap: wrap; gap: .4rem; margin: 1rem 0; }
.tag {
  background: var(--green-50);
  color: var(--green-800);
  padding: .3rem .7rem;
  border-radius: 999px;
  font-size: .8rem;
  font-weight: 500;
}
.info-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 1rem;
}
.info-block {
  background: white;
  border-radius: var(--radius);
  padding: 1.15rem;
  box-shadow: var(--shadow);
  border: 1px solid var(--gray-200);
}
.info-block h3 {
  font-size: .95rem;
  color: var(--green-800);
  margin-bottom: .6rem;
  display: flex;
  align-items: center;
  gap: .4rem;
}
.info-block p, .info-block li {
  font-size: .9rem;
  color: var(--gray-700);
}
.taxo-list {
  list-style: none;
  font-size: .875rem;
}
.taxo-list li {
  display: flex;
  gap: .5rem;
  padding: .25rem 0;
  border-bottom: 1px solid var(--gray-100);
}
.taxo-list .rank {
  color: var(--gray-500);
  min-width: 70px;
  font-size: .8rem;
}

/* Page header */
.page-header {
  margin-bottom: 1.5rem;
}
.page-header h1 {
  font-size: 1.75rem;
  color: var(--green-900);
  margin-bottom: .35rem;
}
.page-header p { color: var(--gray-500); max-width: 640px; }
.breadcrumb {
  font-size: .8rem;
  color: var(--gray-500);
  margin-bottom: .5rem;
}
.breadcrumb a { color: var(--green-600); }
.breadcrumb a:hover { text-decoration: underline; }

/* Loading / empty */
.loading, .empty {
  text-align: center;
  padding: 3rem 1rem;
  color: var(--gray-500);
}
.spinner {
  width: 36px; height: 36px;
  border: 3px solid var(--green-100);
  border-top-color: var(--green-500);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  margin: 0 auto 1rem;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Footer */
.site-footer {
  background: var(--green-900);
  color: rgba(255,255,255,.75);
  padding: 2rem 1.25rem;
  margin-top: 3rem;
  font-size: .85rem;
}
.footer-inner {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  flex-wrap: wrap;
  gap: 1.5rem;
  justify-content: space-between;
  align-items: center;
}
.site-footer a { color: white; opacity: .9; }
.site-footer a:hover { text-decoration: underline; }

/* Remarkable badges */
.badge {
  display: inline-block;
  padding: .2rem .55rem;
  border-radius: 999px;
  font-size: .7rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .02em;
}
.badge-star { background: #fef3c7; color: #92400e; }
.badge-new { background: #dbeafe; color: #1e40af; }
.badge-rare { background: #fce7f3; color: #9d174d; }

/* Simple bar chart */
.bar-chart { display: flex; align-items: flex-end; gap: 6px; height: 160px; padding-top: 1rem; }
.bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; }
.bar {
  width: 100%;
  max-width: 36px;
  background: var(--green-500);
  border-radius: 4px 4px 0 0;
  min-height: 4px;
  transition: height .4s;
}
.bar-label { font-size: .65rem; color: var(--gray-500); margin-top: .35rem; }
.bar-val { font-size: .7rem; font-weight: 600; color: var(--green-800); margin-bottom: .2rem; }

/* Donut legend */
.legend { display: flex; flex-direction: column; gap: .4rem; margin-top: .75rem; }
.legend-item { display: flex; align-items: center; gap: .5rem; font-size: .85rem; }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; }

.photo-thumbs {
  display: flex;
  gap: .5rem;
  flex-wrap: wrap;
  margin-top: .75rem;
}
.photo-thumbs img {
  width: 64px; height: 64px;
  object-fit: cover;
  border-radius: 6px;
  border: 1px solid var(--gray-200);
}

/* Utility */
.mt-1 { margin-top: .5rem; }
.mt-2 { margin-top: 1rem; }
.mt-3 { margin-top: 1.5rem; }
.mb-2 { margin-bottom: 1rem; }
.text-muted { color: var(--gray-500); font-size: .875rem; }
.flex { display: flex; }
.gap-1 { gap: .5rem; }
.hidden { display: none !important; }


/* Images robustes */
.card-img-wrap {
  aspect-ratio: 4/3;
  background: linear-gradient(135deg, #e8f0e0, #d4e4c4);
  overflow: hidden;
  position: relative;
}
.card-img-wrap img,
.card-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  background: linear-gradient(135deg, #e8f0e0, #d4e4c4);
}
.group-card .img-wrap {
  aspect-ratio: 16/10;
  background: linear-gradient(135deg, #e8f0e0, #c5d9a8);
  overflow: hidden;
}
.group-card .img-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* Grande photo de l'espèce */
.photo-card .photo-feature{
  border-radius: 14px;
  overflow: hidden;
  background: #eef2e6;
  aspect-ratio: 4/3;
  margin-top: .35rem;
}
.photo-card .photo-feature img{
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.photo-card .photo-caption{
  margin: .65rem 0 0;
  font-size: .86rem;
  color: #4b5563;
  line-height: 1.35;
}
.photo-card .photo-caption em{
  color: #6b7280;
  font-style: italic;
  font-size: .82rem;
}

/* Classification + statut + photo (colonne gauche des fiches) */
.classif-card{display:flex;flex-direction:column}
.classif-statut{
  margin-top:.85rem;padding-top:.85rem;border-top:1px solid #e5e7eb;
}
.classif-statut-title{
  font-size:.92rem;font-weight:700;color:#1a3a1a;margin:0 0 .45rem;
}
.classif-photo{
  margin-top:.85rem;padding-top:.85rem;border-top:1px solid #e5e7eb;
}
.classif-photo-title{
  font-size:.92rem;font-weight:700;color:#1a3a1a;margin:0 0 .55rem;
}
.classif-photo .photo-feature{
  border-radius:12px;overflow:hidden;background:#e8f0e0;
  border:1px solid #e5e7eb;
}
.classif-photo .photo-feature img{
  width:100%;aspect-ratio:4/3;object-fit:cover;display:block;
}
.classif-photo .photo-caption{
  font-size:.8rem;color:#6b7280;margin:.45rem 0 0;text-align:center;line-height:1.35;
}
.classif-photo .photo-caption em{font-style:italic;color:#9ca3af}
.fiche-bottom-single{grid-template-columns:1fr !important}
.fiche-bottom-single .fiche-card{max-width:100%}

.map-frame{width:100%;height:300px;min-height:300px;border:0;border-radius:12px;margin-bottom:.55rem;background:#e8f0e0}
.obs-card .gallery-row{margin-top:.25rem}
.bio-card .bio-block{margin-bottom:.85rem;padding-bottom:.75rem;border-bottom:1px dashed #e8f0e0}
.bio-card .bio-block:last-of-type{border-bottom:none;margin-bottom:.35rem;padding-bottom:0}
.bio-card .bio-block h3{font-size:.88rem;color:#1a3a1a;margin:0 0 .35rem;font-weight:700}
.bio-card .bio-block p{font-size:.9rem;line-height:1.5;color:#374151;margin:0}
@media(max-width:960px){.map-frame{height:240px;min-height:240px}}

.role-list{margin:.35rem 0 0;padding-left:1.1rem;font-size:.9rem;line-height:1.55;color:#374151}
.role-list li{margin:.25rem 0}
.role-list strong{color:#1a3a1a}
.role-extra{font-size:.85rem;color:#6b7280;margin-top:.5rem}

.page-lead{color:#4b5563;max-width:42rem;line-height:1.5;margin:.35rem 0 0}
.rem-section{margin:1.5rem 0 2rem}
.rem-intro{font-size:.9rem;color:#6b7280;margin:-.25rem 0 1rem;max-width:40rem}
.rem-empty{background:#f7faf5;border:1px dashed #c5d5b8;color:#3f5a3a;font-size:.92rem}
.card-remarquable .rem-badge{
  display:inline-block;font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.02em;
  padding:.2rem .5rem;border-radius:999px;margin-bottom:.4rem;
}
.badge-protege{background:#ede9fe;color:#5b21b6}
.badge-nt{background:#fef3c7;color:#92400e}
.badge-rare{background:#fee2e2;color:#991b1b}
.badge-embleme{background:#e8f0e0;color:#1a3a1a}

/* ===== Page Statistiques (style type iNaturalist) ===== */
.stats-page .page-lead{margin-bottom:1rem}
.stats-dark{
  background:#0f172a;color:#e2e8f0;border-radius:16px;padding:1.25rem 1.25rem 1.5rem;
  margin-bottom:1.25rem;box-shadow:0 8px 24px rgba(15,23,42,.25);
}
.stats-block{padding-top:1.5rem}
.stats-h{text-align:center;font-size:1.15rem;font-weight:700;color:#f8fafc;margin:0 0 .75rem;
  border-bottom:1px solid #334155;padding-bottom:.65rem}
.stats-h.light{color:#1a3a1a;border-color:#e5e7eb;text-align:left}
.stats-help{font-size:.82rem;line-height:1.5;color:#94a3b8;max-width:52rem;margin:0 auto 1rem;text-align:center}
.donut-row{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;align-items:start}

te au potager.","source":"Espèce non indigène (indicatif)","category":"introduite","color":"#d97706"},"conservation":{"code":"NA","label":"Hors liste rouge des espèces indigènes","color":"#64748b","authority":"Espèce non indigène / exotique","place":"France métropolitaine","status_name":"NA"},"phenologie":[{"label":"Adultes visibles","start":4,"end":10,"color":"#5c820d"}],"premiere_obs":"2026-06-21","derniere_obs":"2026-06-21","periode_obs":"Juin 2026","nb_obs":null,"galerie":[],"classification":[],"wiki_url":null,"jessica_url":"https://jessica-joachim.com/insectes/hemipteres/punaises/pentatomidae/punaise-verte-ponctuee-nezara-viridula/","role_source":{"name":"Jessica Joachim — Les carnets nature de Jessica","url":"https://jessica-joachim.com/insectes/hemipteres/punaises/pentatomidae/punaise-verte-ponctuee-nezara-viridula/","site":"https://jessica-joachim.com/","note":"Rôle et milieu adaptés avec autorisation à partir des fiches (Habitat, Régime, Réseau trophique, Biologie, Plantes hôtes)."},"biologie":"La femelle pond des œufs de couleur blanc cassé disposés en nid d’abeille (ooplaque). Ils ont la forme de petits tonnelets et sont le plus souvent situés à la face inférieure des feuilles. Une fois les œufs éclos, les larves restent groupées autour de l’ooplaque sans se nourrir pendant 24 à 48h et ce n’est qu’au deuxième stade larvaire qu’elles commencent à se disperser sur la plante pour s’alimenter. La durée de développement dépend de la température, environ 58 jours à 20 °C, 34 jours à 25 °C Larves : Il y a 5 stades larvaires au total. Durant les trois premiers stades, elles sont de couleur noire avec des taches blanches. Puis des couleurs vertes rouges et roses apparaissent, toujours avec ces taches blanches.","source_jessica":{"name":"Les carnets nature de Jessica Joachim","url":"https://jessica-joachim.com/insectes/hemipteres/punaises/pentatomidae/punaise-verte-ponctuee-nezara-viridula/","credit":"D’après les carnets nature de Jessica Joachim (jessica-joachim.com), avec autorisation."},"role_specifique":true,"taille":"Longueur 12–16 mm.","associations":"Plantes nectarifères ou hôtes ; proies ou prédateurs dans le réseau trophique local.","pollinisateur":"Non","regime_alimentaire":"Sève de nombreuses plantes (légumes, fruitiers, adventices).","utilite":"Parfois nuisible aux cultures ; proie de guêpes parasitoïdes et oiseaux.","photos":[{"s":"https://inaturalist-open-data.s3.amazonaws.com/photos/684601158/square.jpg","m":"https://inaturalist-open-data.s3.amazonaws.com/photos/684601158/medium.jpg","obs_id":374538380,"user":"exogene"}],"description":"Punaise verte avec des points blancs sur le pourtour du corps. Se nourrit de sève de nombreuses plantes."},"61891":{"taxon_id":61891,"name":"Sphecodes","common":"Sphécodes","iconic":"Insecta","count":1,"intro":"lisses","description_bio":"lisses","biotope":"On les rencontre souvent sur les fleurs d’plantes en ombelle et d’ Asteraceae , mais aussi sur d’autres plantes nectarifères. Période d’observation : De mars à septembre.","ecologie":"Pollinisateur : Oui (adultes sur fleurs). Alimentation : Adultes : nectar. Larves : parasites d’autres abeilles sauvages (Halictidae). Utilité : Pollinisation légère ; régule les populations d’abeilles solitaires (équilibre écologique).","habitat_court":"On les rencontre souvent sur les fleurs d’plantes en ombelle et d’ Ast","enrichi":true,"photo":{"s":"https://inaturalist-open-data.s3.amazonaws.com/photos/690766442/square.jpg","m":"https://inaturalist-open-data.s3.amazonaws.com/photos/690766442/medium.jpg"},"photo_from_owner":true,"obs_id":377725622,"statut_local":{"label":"Indigène","detail":"Sphécodes : genre d’abeilles parasites indigène en Europe (plusieurs espèces).","source":"Faune / flore de France (indicatif)","category":"indigene","color":"#16a34a"},"conservation":{"code":"NE","label":"Non évaluée","color":"#94a3b8","authority":"Pas de statut UICN établi pour ce niveau","place":"—","status_name":"NE"},"phenologie":[{"label":"Adultes visi s… Adulte ne se nourrit pas. Utilité : Recycle la biomasse foliaire ; proie importante pour oiseaux et parasitoïdes.","habitat_court":"Bois clairs et zones marécageuses du niveau de la mer jusqu’à 2000 m","enrichi":true,"photo":{"s":"https://inaturalist-open-data.s3.amazonaws.com/photos/659673424/square.jpg","m":"https://inaturalist-open-data.s3.amazonaws.com/photos/659673424/medium.jpg"},"photo_from_owner":true,"obs_id":361465045,"statut_local":{"label":"Indigène","detail":"Bombyx du chêne : indigène d’Europe.","source":"Faune / flore de France (indicatif)","category":"indigene","color":"#16a34a"},"conservation":{"code":"NE","label":"Non évaluée","color":"#94a3b8","authority":"Pas de statut UICN établi pour ce niveau","place":"—","status_name":"NE"},"phenologie":[{"label":"Adultes visibles","start":5,"end":8,"color":"#5c820d"},{"label":"Chenilles","start":7,"end":12,"color":"#ca8a04"},{"label":"Chenilles","start":1,"end":5,"color":"#ca8a04"}],"premiere_obs":"2026-05-14","derniere_obs":"2026-05-14","periode_obs":"Mai 2026","nb_obs":1,"galerie":[{"s":"https://inaturalist-open-data.s3.amazonaws.com/photos/659673424/square.jpg","id":361465045}],"classification":[{"rank":"kingdom","id":1,"name":"Animalia","common":"Animaux"},{"rank":"phylum","id":47120,"name":"Arthropoda","common":"Arthropodes"},{"rank":"class","id":47158,"name":"Insecta","common":"Insectes"},{"rank":"order","id":47157,"name":"Lepidoptera","common":"Lépidoptères (Papillons)"},{"rank":"family","id":56584,"name":"Lasiocampidae","common":"Livrées et lasiocampes"},{"rank":"genus","id":56585,"name":"Lasiocampa","common":"Lasiocampa"},{"rank":"species","id":56582,"name":"Lasiocampa quercus","common":"Bombyx du Chêne"}],"wiki_url":"https://fr.wikipedia.org/wiki/Bombyx_du_ch%C3%AAne","jessica_url":"https://jessica-joachim.com/insectes/lepidopteres/lasiocampidae/bombyx-du-chene-lasiocampa-quercus/","role_source":{"name":"Jessica Joachim — Les carnets nature de Jessica","url":"https://jessica-joachim.com/insectes d":60132,"name":"Cirsium arvense","common":"Cirse des champs","iconic":"Plantae","count":1,"intro":"Cirsium arvense, en français le Chardon des champs ou le Cirse des champs, est une espèce de plantes à fleurs du genre Cirsium et de la famille des Astéracées. Très commune dans toute l'Europe, c'est une plante…","description_bio":"Le Cirse des champs ( Cirsium arvense ) possède une tige dressée, anguleuse, non ailée et sans épines, ramifiée dans le haut. L’ inflorescence est faite de groupes de petits capitules comprenant des fleurs tubulées de couleur lilas, pourpres ou plus rarement blanches. L’involucre est pyriforme ou subcylindrique, à bractées pourprées, possédant une courte pointe étalée, blanchâtre à pourpre. Le tiers apical de la nervure médiane des bractées externes et médianes est élargi. La plante est dioïque","biotope":"Prairies, friches, champs de 0 à 2200m. C’est une plante nitrophile.","ecologie":"Pollinisateur : Indirect — offre nectar, pollen et/ou abri aux pollinisateurs. Alimentation : Autotrophe (photosynthèse) ; eau et nutriments du sol. Utilité : Cette plante sert de nourriture à de nombreux insectes : papillons, coléoptères, diptères, punaises. Les fleurs sont riches en nectar et en pollen et sont une source de nourriture intéressante pour de nombreux insectes.","habitat_court":"Prairies, friches, champs de 0 à 2200m","enrichi":true,"photo":{"s":"https://inaturalist-open-data.s3.amazonaws.com/photos/715222115/square.jpg","m":"https://inaturalist-open-data.s3.amazonaws.com/photos/715222115/medium.jpg"},"photo_from_owner":true,"obs_id":390398278,"statut_local":{"label":"Indigène","detail":"Cirse des champs : indigène (adventice agricole, non exotique).","source":"Faune / flore de France (indicatif)","category":"indigene","color":"#16a34a"},"conservation":{"code":"LC","label":"Préoccupation mineure","color":"#22c55e","authority":"UICN / listes de référence","place":"France / global (indicatif)","status_name":"LC"},"phenologie":[{"label":"Feuillai es/coleopteres-scarabees-coccinelles/scarabaeidae/cetoine-doree-cetonia-aurata/","site":"https://jessica-joachim.com/","note":"Rôle et milieu adaptés avec autorisation à partir des fiches (Habitat, Régime, Réseau trophique, Biologie, Plantes hôtes)."},"description":"La Cétoine dorée ( Cetonia aurata ) est un gros coléoptère de couleur vert métallique, pouvant parfois devenir cuivré. Le pronotum est glabre et les ailes dures échancrés latéralement. Les côtes élytrales sont assez marquées et l’arrière des ailes dures possède des fascies blanches. Elle possède une saillie mésosternale sphérique et globuleuse. Le mâle a une dépression longitudinale sur le dessous de l’abdomen que ne possède pas la femelle.","biologie":"Assez à l’aise en vol, il a la particularité de voler ailes dures fermés. Les ailes sortent par un passage à cet effet sur les côtés des ailes dures. Larves : Elles se développent dans le bois pourrissant et le sol (et participent activement à la formation de terreau en se nourrissant de matières végétales en décomposition -et non pas de racines-). Ce sont de gros vers blancs. Leur développement se fait sur 3 ans.","periode_txt":"De début avril à octobre.","source_jessica":{"name":"Les carnets nature de Jessica Joachim","url":"https://jessica-joachim.com/insectes/coleopteres-scarabees-coccinelles/scarabaeidae/cetoine-doree-cetonia-aurata/","credit":"D’après les carnets nature de Jessica Joachim (jessica-joachim.com), avec autorisation."},"role_specifique":true,"taille":"Longueur 14–20 mm. Larves « vers blancs » en C : jusqu’à ~3–4 cm.","associations":"Fleurs (sureau, fruitiers, ombellifères…) ; larves dans bois mort / compost.","pollinisateur":"Oui (adulte floricole)","regime_alimentaire":"Adulte : pollen et organes floraux (sureau, fruitiers, ombellifères, roses…). Larve : bois mort, terreau, compost.","utilite":"Pollinisation / visite florale ; larves recyclent matière organique (pas de ravageur des racines comme hanneton).","photos":[{"s":"https://inat <script>

const PLACEHOLDER = "data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22400%22%20height%3D%22300%22%3E%3Crect%20fill%3D%22%23e8f0e0%22%20width%3D%22400%22%20height%3D%22300%22/%3E%3Ctext%20x%3D%22200%22%20y%3D%22155%22%20text-anchor%3D%22middle%22%20fill%3D%22%235c820d%22%20font-size%3D%2216%22%20font-family%3D%22sans-serif%22%3EPas%20de%20photo%3C/text%3E%3C/svg%3E";

function pageStats(){
  mount('stats');
  const m=document.getElementById('app-main');
  m.className='container stats-page';
  const s=DATA.stats||{};
  const totalObs=s.totalObs||s.observations||DATA.species.reduce((a,x)=>a+(x.count||0),0);
  const totalSp=s.totalSpecies||s.species||(DATA.species||[]).length;
  const research=s.researchGrade||0;
  const needsId=Math.max(0, Math.round(totalObs*0.08)); // estimation légère si non fourni
  const casual=Math.max(0, totalObs-research-needsId);
  const observers=s.observers||s.totalObservers||'—';

  const GROUP_COLORS={
    Insecta:'#f97316', Plantae:'#65a30d', Fungi:'#a855f7', Aves:'#0ea5e9',
    Mammalia:'#78716c', Amphibia:'#14b8a6', Arachnida:'#eab308', Reptilia:'#84cc16', Mollusca:'#f472b6'
  };
  const iconic=(DATA.iconic||[]).map(g=>({
    key:g.key,
    label:GROUPES_FR[g.name||g.key]||g.label||g.name||g.key,
    count:g.count||0,
    color:GROUP_COLORS[g.key]||'#94a3b8'
  })).filter(g=>g.count>0);

  // Statuts
  const stCount={indigene:0,introduite:0,envahissante:0,protegee:0,autre:0};
  Object.values(DATA.fiches||{}).forEach(f=>{
    const c=(f.statut_local&&f.statut_local.category)||'autre';
    if(stCount[c]!=null) stCount[c]++; else stCount.autre++;
  });

  // Qualité obs (donut 1)
  const quality=[
    {label:'Recherche', count:research, color:'#84cc16'},
    {label:'Besoin d\'ID', count:needsId, color:'#fde047'},
    {label:'Informel', count:casual, color:'#94a3b8'}
  ].filter(x=>x.count>0);

  // Identifications proxy (donut 3) — répartition simple
  const idParts=[
    {label:'En tête / confirmées', count:research, color:'#84cc16'},
    {label:'Soutien', count:Math.max(1, Math.round(research*0.15)), color:'#fde047'},
    {label:'À améliorer', count:Math.max(0, totalSp-research+needsId), color:'#4d7c0f'}
  ].filter(x=>x.count>0);

  // Mois d'observation (à partir des dates des fiches)
  const monthNames=['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Aoû','Sep','Oct','Nov','Déc'];
  const byMonth=Array(12).fill(0);
  const byYear={};
  (DATA.species||[]).forEach(sp=>{
    const f=(DATA.fiches&&DATA.fiches[String(sp.taxon_id)])||{};
    const d=f.derniere_obs||f.premiere_obs||'';
    if(d && d.length>=7){
      const y=d.slice(0,4), mo=+d.slice(5,7);
      if(mo>=1&&mo<=12) byMonth[mo-1]+=(sp.count||1);
      byYear[y]=(byYear[y]||0)+(sp.count||1);
    }
  });
  // fallback: distribute totalObs if months empty
  if(byMonth.every(x=>x===0) && totalObs){
    // peak summer default from known project season
    [3,4,5,6,7,8,9].forEach((i,idx)=>{ byMonth[i]=Math.round(totalObs*[0.05,0.15,0.14,0.12,0.16,0.12,0.1][idx]||0); });
  }
  const years=Object.keys(byYear).sort();
  const yCurrent=years[years.length-1]||String(new Date().getFullYear());
  const yPrev=years.length>1?years[years.length-2]:String(+yCurrent-1);
  const obsYear=y=>byYear[y]||0;
  // species per year approx from premiere_obs
  const spByYear={};
  Object.values(DATA.fiches||{}).forEach(f=>{
    const d=f.premiere_obs||'';
    if(d&&d.length>=4){ const y=d.slice(0,4); spByYear[y]=(spByYear[y]||0)+1; }
  });

  // Top espèces
  const top=[...(DATA.species||[])].sort((a,b)=>(b.count||0)-(a.count||0)).slice(0,8);

  // Arbre taxonomique pour sunburst (2–3 niveaux)
  function buildTaxonTree(){
    const root={name:'Êtres vivants', count:0, children:{}, color:'#1e3a5f'};
    (DATA.species||[]).forEach(sp=>{
      const f=(DATA.fiches&&DATA.fiches[String(sp.taxon_id)])||{};
      const n=sp.count||1;
      const iconic=sp.iconic||'Autre';
      const gLabel=GROUPES_FR[iconic]||iconic;
      const classif=f.classification||[];
      let family=(classif.find(r=>r.rank==='family')||{});
      let famName=family.common||family.name||'Autres';
      // French-ish short
      if(/idae$/i.test(famName)||/aceae$/i.test(famName)){
        // keep latin family if no common — ok for sunburst detail
      }
      if(!root.children[iconic]){
        root.children[iconic]={name:gLabel, key:iconic, count:0, children:{}, color:GROUP_COLORS[iconic]||'#94a3b8'};
      }
      const gNode=root.children[iconic];
      gNode.count+=n;
      if(!gNode.children[famName]){
        gNode.children[famName]={name:famName, count:0, children:{}, color:gNode.color};
      }
      gNode.children[famName].count+=n;
      // species leaf
      const sname=sp.common||sp.name;
      gNode.children[famName].children[sname]={name:sname, count:n, taxon_id:sp.taxon_id, color:gNode.color, children:{}};
      root.count+=n;
    });
    function toArr(node){
      const kids=Object.values(node.children||{}).map(toArr).sort((a,b)=>b.count-a.count);
      return {name:node.name, count:node.count, color:node.color, key:node.key, taxon_id:node.taxon_id, children:kids};
    }
    return toArr(root);
  }
  const taxTree=buildTaxonTree();

  m.innerHTML=
    '<div class="page-header"><h1>Statistiques</h1>'+
      '<p class="page-lead">Vue d’ensemble du projet Jardin-Verger de Pardaillan — même esprit que les bilans iNaturalist (anneaux, taxonomie, saisons).</p></div>'+

    // —— DONUTS ——
    '<section class="stats-dark">'+
      '<div class="donut-row" id="donut-row"></div>'+
      '<div class="stats-meta">'+
        '<div class="stats-meta-item"><span class="k">Observateurs</span><span class="v">'+esc(String(observers))+'</span></div>'+
        '<div class="stats-meta-item"><span class="k">Espèces protégées</span><span class="v">'+stCount.protegee+'</span></div>'+

        '<div class="stats-meta-item"><span class="k">Indigènes (fiches)</span><span class="v">'+stCount.indigene+'</span></div>'+
      '</div>'+
    '</section>'+

    // —— SUNBURST ——
    '<section class="stats-dark stats-block">'+
      '<h2 class="stats-h">Espèces observées</h2>'+
      '<p class="stats-help">Répartition taxonomique « en soleil » : le centre regroupe tous les êtres vivants du projet ; chaque anneau détaille un niveau (groupe → famille → espèces les plus vues). La taille des arcs est proportionnelle au nombre d’observations. Vert ≈ plantes, orange ≈ insectes, bleu ≈ oiseaux, etc.</p>'+
      '<div class="sunburst-wrap"><div id="sunburst"></div><div id="sunburst-legend" class="sunburst-legend"></div></div>'+
    '</section>'+

      '<h2 class="stats-h">Activité au fil des mois</h2>'+

      '<div id="month-bars" class="month-bars"></div>'+
    '</section>'+

    '<section class="stats-dark stats-block">'+
      '<h2 class="stats-h">Comparaison avec les années précédentes</h2>'+
      '<p class="stats-help">Barre verte = année la plus récente disponible, barre claire = année précédente. Les zones grises rappellent l’échelle (max du jeu de données).</p>'+
      '<div class="year-legend"><span class="yl y-cur"></span> '+esc(yCurrent)+' &nbsp; <span class="yl y-prev"></span> '+esc(yPrev)+'</div>'+
      '<div id="year-bars" class="year-bars"></div>'+
    '</section>'+

    // —— TOP + STATUTS ——
    '<section class="stats-light">'+
      '<div class="stats-two">'+
        '<div><h2 class="stats-h light">Top espèces (observations)</h2><div class="top-list" id="top-list"></div></div>'+
        '<div><h2 class="stats-h light">Origine / statut des fiches</h2><div id="status-bars"></div></div>'+
      '</div>'+
    '</section>';

  // --- Donut renderer ---
  function donutSVG(segments, centerLabel, centerSub, size){
    const S=size||180; const cx=S/2, cy=S/2, R=S*0.38, r=S*0.26;
    const sum=segments.reduce((a,b)=>a+b.count,0)||1;
    let a0=-Math.PI/2;
    const paths=segments.map(seg=>{
      const ang=(seg.count/sum)*Math.PI*2;
      const a1=a0+ang;
      const x0=cx+R*Math.cos(a0), y0=cy+R*Math.sin(a0);
      const x1=cx+R*Math.cos(a1), y1=cy+R*Math.sin(a1);
      const xi0=cx+r*Math.cos(a0), yi0=cy+r*Math.sin(a0);
      const xi1=cx+r*Math.cos(a1), yi1=cy+r*Math.sin(a1);
      const large=ang>Math.PI?1:0;
      // donut path
      const d=['M',x0,y0,'A',R,R,0,large,1,x1,y1,'L',xi1,yi1,'A',r,r,0,large,0,xi0,yi0,'Z'].join(' ');
      a0=a1;
      return '<path d="'+d+'" fill="'+seg.color+'" stroke="#0f172a" stroke-width="1"><title>'+esc(seg.label)+' : '+seg.count+'</title></path>';
    }).join('');
    const legend=segments.map(seg=>'<div class="donut-leg"><span class="dot" style="background:'+seg.color+'"></span>'+esc(seg.label)+' <em>'+seg.count+'</em></div>').join('');
    return '<div class="donut-card"><svg width="'+S+'" height="'+S+'" viewBox="0 0 '+S+' '+S+'">'+paths+
      '<text x="'+cx+'" y="'+(cy-4)+'" text-anchor="middle" class="donut-num">'+centerLabel+'</text>'+
      '<text x="'+cx+'" y="'+(cy+16)+'" text-anchor="middle" class="donut-sub">'+esc(centerSub)+'</text></svg>'+
      '<div class="donut-legs">'+legend+'</div></div>';
  }

  document.getElementById('donut-row').innerHTML=
    donutSVG(quality, String(totalObs), 'OBSERVATIONS', 200)+
    donutSVG(iconic.map(g=>({label:g.label,count:g.count,color:g.color})), String(totalSp), 'ESPÈCES', 200)+
    donutSVG(idParts, String(research), 'NIV. RECHERCHE', 200);

  // --- Sunburst (arcs by angle) ---
  function renderSunburst(tree){
    const S=420, cx=S/2, cy=S/2;
    const levels=3; // center hole + 3 rings
    const ringW=48;
    const R0=36;
    // Flatten levels: L1 children of root, L2 children of L1, L3 top leaves
    function layout(node, depth, a0, a1, out){
      if(depth>3) return;
      const kids=(node.children||[]).filter(c=>c.count>0);
      const sum=kids.reduce((a,b)=>a+b.count,0)||node.count||1;
      let t=a0;
      kids.forEach(k=>{
        const span=(k.count/sum)*(a1-a0);
        const t1=t+span;
        out.push({node:k, depth, a0:t, a1:t1});
        layout(k, depth+1, t, t1, out);
        t=t1;
      });
    }
    const arcs=[];
    // root full circle as center button
    layout(tree, 1, -Math.PI/2, -Math.PI/2+Math.PI*2, arcs);
    function arcPath(a0,a1,ro,ri){
      const large=(a1-a0)>Math.PI?1:0;
      const x0=cx+ro*Math.cos(a0), y0=cy+ro*Math.sin(a0);
      const x1=cx+ro*Math.cos(a1), y1=cy+ro*Math.sin(a1);
      const xi0=cx+ri*Math.cos(a0), yi0=cy+ri*Math.sin(a0);
      const xi1=cx+ri*Math.cos(a1), yi1=cy+ri*Math.sin(a1);
      return ['M',x0,y0,'A',ro,ro,0,large,1,x1,y1,'L',xi1,yi1,'A',ri,ri,0,large,0,xi0,yi0,'Z'].join(' ');
    }
    const paths=arcs.map((a,i)=>{
      const ro=R0+a.depth*ringW;
      const ri=R0+(a.depth-1)*ringW+2;
      const col=a.node.color||'#64748b';
      // lighten by depth
      const op=1-a.depth*0.08;
      const tid=a.node.taxon_id?(' data-espece="'+a.node.taxon_id+'"'):'';
      return '<path class="sb-arc" data-i="'+i+'"'+tid+' d="'+arcPath(a.a0,a.a1,ro,ri)+'" fill="'+col+'" fill-opacity="'+op+'" stroke="#0f172a" stroke-width="0.6">'+
        '<title>'+esc(a.node.name)+' — '+a.node.count+' obs.</title></path>';
    }).join('');
    const svg='<svg id="sb-svg" width="100%" height="'+S+'" viewBox="0 0 '+S+' '+S+'">'+paths+
      '<circle cx="'+cx+'" cy="'+cy+'" r="'+(R0-4)+'" fill="#1e293b" stroke="#334155"/>'+
      '<text x="'+cx+'" y="'+(cy-2)+'" text-anchor="middle" class="sb-center-num">'+tree.count+'</text>'+
      '<text x="'+cx+'" y="'+(cy+16)+'" text-anchor="middle" class="sb-center-sub">obs.</text></svg>';
    document.getElementById('sunburst').innerHTML=svg;
    // legend top groups
    document.getElementById('sunburst-legend').innerHTML=iconic.map(g=>
      '<div class="donut-leg"><span class="dot" style="background:'+g.color+'"></span>'+esc(g.label)+' <em>'+g.count+'</em></div>'
    ).join('');
    // click species arcs
    document.querySelectorAll('#sb-svg .sb-arc[data-espece]').forEach(el=>{
      el.style.cursor='pointer';
      el.addEventListener('click',()=>{ location.hash='#espece/'+el.getAttribute('data-espece'); });
    });
  }
  renderSunburst(taxTree);

  // --- Month bars ---
  const maxM=Math.max(1,...byMonth);
  document.getElementById('month-bars').innerHTML=byMonth.map((v,i)=>
    '<div class="mbar"><div class="mbar-fill" style="height:'+(v/maxM*120)+'px" title="'+monthNames[i]+' : '+v+'"></div><span>'+monthNames[i]+'</span></div>'
  ).join('');

  // --- Year comparison bars ---
  const rows=[
    {label:'Nouvelles espèces / année', cur:spByYear[yCurrent]||0, prev:spByYear[yPrev]||0},
    {label:'Observations / année', cur:obsYear(yCurrent), prev:obsYear(yPrev)},
    {label:'Espèces cumulées (approx.)', cur:totalSp, prev:Math.max(0,totalSp-(spByYear[yCurrent]||0))}
  ];
  const maxY=Math.max(1,...rows.flatMap(r=>[r.cur,r.prev]));
  document.getElementById('year-bars').innerHTML=rows.map(r=>
    '<div class="yrow"><div class="ylab">'+esc(r.label)+'</div><div class="ytracks">'+
      '<div class="ytrack"><div class="yfill cur" style="width:'+(r.cur/maxY*100)+'%"></div><span class="yval">'+r.cur+' · '+esc(yCurrent)+'</span></div>'+
      '<div class="ytrack"><div class="yfill prev" style="width:'+(r.prev/maxY*100)+'%"></div><span class="yval">'+r.prev+' · '+esc(yPrev)+'</span></div>'+
    '</div></div>'
  ).join('');

  // Top list
  document.getElementById('top-list').innerHTML=top.map((sp,i)=>
    '<a class="top-row" href="#espece/'+sp.taxon_id+'" data-espece="'+sp.taxon_id+'">'+
      '<span class="top-rank">'+(i+1)+'</span>'+
      '<span class="top-name">'+esc(sp.common)+'<small>'+esc(sp.name)+'</small></span>'+
      '<span class="top-count">'+(sp.count||0)+'</span>'+
      '<span class="top-bar"><i style="width:'+((sp.count||0)/Math.max(1,top[0].count||1)*100)+'%"></i></span>'+
    '</a>'
  ).join('');

  // Status bars
  const stRows=[
    {label:'Indigènes', n:stCount.indigene, color:'#16a34a'},
    {label:'Protégées', n:stCount.protegee, color:'#7c3aed'},
    {label:'Introduites', n:stCount.introduite, color:'#d97706'},
    {label:'Envahissantes', n:stCount.envahissante, color:'#dc2626'},
    {label:'Autres / locaux', n:stCount.autre, color:'#64748b'}
  ];
  const maxS=Math.max(1,...stRows.map(x=>x.n));
  document.getElementById('status-bars').innerHTML=stRows.map(r=>
    '<div class="strow"><span class="stlab">'+r.label+'</span>'+
    '<div class="sttrack"><div class="stfill" style="width:'+(r.n/maxS*100)+'%;background:'+r.color+'"></div></div>'+
    '<span class="stn">'+r.n+'</span></div>'
  ).join('');

  bind();
}

function pageRemarquables(){
  mount('remarquables');const m=document.getElementById('app-main');m.className='container';
  const ficheOf=s=>(DATA.fiches&&DATA.fiches[String(s.taxon_id)])||{};
  const isProtegee=s=>{
    const f=ficheOf(s);const st=f.statut_local||{};const cons=f.conservation||{};
    if(st.category==='protegee') return true;
    if(['NT','VU','EN','CR','RE','EW'].includes(String(cons.code||'').toUpperCase())) return true;
    // oiseaux (protection générale) + amphibiens + hérisson déjà couverts via category
    return false;
  };
  const isRare=s=>{
    // rare locale : 1 seule observation ET pas une espèce banale de liste "emblématique fréquent"
    const f=ficheOf(s);const cons=f.conservation||{};
    if(isProtegee(s)) return false; // déjà dans l'autre panier si protégée
    // marquée rare manuellement
    if(f.remarquable==='rare'||f.rare===true) return true;
    // statut conservation DD avec peu d'obs, ou espèce à fort intérêt
    if(['VU','EN','CR'].includes(String(cons.code||'').toUpperCase())) return true;
    return false;
  };
  // 1) Rares ou protégées
  const rares=[];
  const seen=new Set();
  DATA.species.forEach(s=>{
    if(isProtegee(s)||isRare(s)){
      const f=ficheOf(s);
      rares.push({
        sp:s,f,
        badge: (f.statut_local&&f.statut_local.category==='protegee') ? 'Protégée' :
               (f.conservation&&['NT','VU','EN','CR'].includes(String(f.conservation.code||'').toUpperCase())) ? (f.conservation.code+' — '+(f.conservation.label||'menacée')) :
               'Rare',
        badgeClass: (f.statut_local&&f.statut_local.category==='protegee') ? 'badge-protege' :
                    (f.conservation&&String(f.conservation.code).toUpperCase()==='NT') ? 'badge-nt' : 'badge-rare'
      });
      seen.add(s.taxon_id);
    }
  });
  // tri : menacées d'abord, puis protégées, puis nom
  const rank=b=>({ 'badge-nt':0,'badge-protege':1,'badge-rare':2 }[b.badgeClass]??3);
  rares.sort((a,b)=>rank(a)-rank(b)||String(a.sp.common).localeCompare(String(b.sp.common),'fr'));

  // 2) Emblématiques du jardin : > 10 observations
  const SEUIL_EMBLEME=10;
  const emblemes=DATA.species
    .filter(s=>(s.count||0)>SEUIL_EMBLEME)
    .sort((a,b)=>(b.count||0)-(a.count||0))
    .map(s=>({sp:s,f:ficheOf(s),badge:(s.count||0)+' observations',badgeClass:'badge-embleme'}));

  const maxCount=DATA.species.reduce((m,s)=>Math.max(m,s.count||0),0);

  const card=it=>{
    const s=it.sp;
    return '<a class="card card-remarquable" href="#espece/'+s.taxon_id+'" data-espece="'+s.taxon_id+'">'+
      imgCard(s.photo,s.common)+
      '<div class="card-body">'+
        '<div class="rem-badge '+it.badgeClass+'">'+esc(it.badge)+'</div>'+
        '<h3>'+esc(s.common)+'</h3>'+
        '<div class="sci">'+esc(s.name)+'</div>'+
        '<div class="text-muted" style="font-size:.8rem;margin-top:.25rem">'+(s.count||0)+' obs. · '+(GROUPES_FR[s.iconic]||s.iconic||'')+'</div>'+
      '</div></a>';
  };

  const empty=msg=>'<div class="panel rem-empty"><p>'+msg+'</p></div>';

  m.innerHTML=
    '<div class="page-header">'+
      '<h1>Espèces remarquables</h1>'+
      '<p class="page-lead">Deux regards sur le jardin : les espèces à protéger ou rares, et celles qui marquent le lieu par leur fréquence (>&nbsp;'+SEUIL_EMBLEME+' observations).</p>'+
    '</div>'+

    '<section class="rem-section">'+
      '<div class="section-title"><span>🛡️ Espèces rares ou protégées</span><span class="text-muted">'+rares.length+'</span></div>'+
      '<p class="rem-intro">Espèces protégées en France, ou concernées par un statut de conservation (quasi menacée, vulnérable…).</p>'+
      (rares.length ? '<div class="card-grid">'+rares.map(card).join('')+'</div>' : empty('Aucune espèce rare ou protégée n’est encore renseignée dans les fiches.'))+
    '</section>'+

    '<section class="rem-section">'+
      '<div class="section-title"><span>⭐ Espèces emblématiques du jardin</span><span class="text-muted">'+emblemes.length+'</span></div>'+
      '<p class="rem-intro">Espèces observées <strong>plus de '+SEUIL_EMBLEME+' fois</strong> sur le projet — elles caractérisent le jardin-verger au fil des saisons.</p>'+
      (emblemes.length
        ? '<div class="card-grid">'+emblemes.map(card).join('')+'</div>'
        : empty('Pas encore d’espèce au-delà de <strong>'+SEUIL_EMBLEME+' observations</strong> (record actuel : <strong>'+maxCount+'</strong>). Elles apparaîtront ici automatiquement après les prochaines sorties et la mise à jour iNaturalist.'))+
    '</section>';
  bind();
}

function phenoHTML(ph){
  if(!ph||!ph.length)return '<p class="pheno-note">Calendrier à compléter.</p>';
  // Group by label so multi-segment periods (hiver) share one row
  const order=[]; const map={};
  ph.forEach(p=>{
    const k=p.label||'';
    if(!map[k]){ map[k]=[]; order.push(k); }
    map[k].push(p);
  });
  const rows=order.map(label=>{
    const segs=map[label].map(p=>{
      const left=((p.start-1)/12*100).toFixed(1);
      const width=((p.end-p.start+1)/12*100).toFixed(1);
      return '<div class="pheno-fill" style="left:'+left+'%;width:'+width+'%;background:'+(p.color||'#5c820d')+'"></div>';
    }).join('');
    return '<div style="font-size:.8rem;font-weight:600;margin-top:.35rem">'+esc(label)+'</div><div class="pheno-track">'+segs+'</div>';
  }).join('');
  return rows+'<div style="display:grid;grid-template-columns:repeat(12,1fr);font-size:.65rem;color:#6b7280;text-align:center">'+MONTHS.map(x=>'<span>'+x+'</span>').join('')+'</div><p class="pheno-note">Indicatif pour la France tempérée — peut varier selon le climat et l’année.</p>';
}
function classHTML(ranks){
  if(!ranks||!ranks.length)return '<p class="text-muted">Classification en chargement…</p>';
  return ranks.map(r=>{
    const lab=RANK_FR[r.rank]||r.rank;
    const val=(r.rank==='species'||r.rank==='genus')?('<em>'+esc(r.name)+'</em>'):esc(r.common||r.name);
    return '<div class="taxo-row"><div class="taxo-rank">'+esc(lab)+'</div><div class="taxo-val"><a href="#espece/'+r.id+'" data-espece="'+r.id+'">'+val+'</a></div></div>';
  }).join('');
}


function applyFichesPersonnelles(perso){
  if(!perso||!perso.fiches||!DATA) return;
  if(!DATA.fiches) DATA.fiches={};
  perso.fiches.forEach(function(row){
    if(!row||row.taxon_id==null) return;
    var tid=String(row.taxon_id);
    var f=DATA.fiches[tid]||{taxon_id:row.taxon_id, name:row.nom_latin, common:row.nom_francais};
    if(row.nom_francais) f.common=row.nom_francais;
    if(row.intro!=null&&row.intro!=='') f.intro=row.intro;
    if(row.description!=null&&row.description!==''){ f.description_bio=row.description; f.description=row.description; }
    if(row.milieu_de_vie!=null&&row.milieu_de_vie!=='') f.biotope=row.milieu_de_vie;
    if(row.role_dans_la_nature!=null&&row.role_dans_la_nature!=='') f.ecologie=row.role_dans_la_nature;
    if(row.habitat_court!=null&&row.habitat_court!=='') f.habitat_court=row.habitat_court;
    if(row.taille!=null&&row.taille!=='') f.taille=row.taille;
    if(row.sol!=null&&row.sol!=='') f.sol=row.sol;
    if(row.associations!=null&&row.associations!=='') f.associations=row.associations;
    if(row.especes_associees!=null&&row.especes_associees!=='') f.associations=row.especes_associees;
    if(row.biologie!=null&&row.biologie!=='') f.biologie=row.biologie;
    if(row.pollinisateur!=null&&row.pollinisateur!=='') f.pollinisateur=row.pollinisateur;
    if(row.regime_alimentaire!=null&&row.regime_alimentaire!=='') f.regime_alimentaire=row.regime_alimentaire;
    if(row.utilite!=null&&row.utilite!=='') f.utilite=row.utilite;

    if(row.source_note||row.source_url){
      f.source_jessica={
        name:'Édition locale',
        credit:row.source_note||'',
        url:row.source_url||''
      };
    }
    f.enrichi=true;
    DATA.fiches[tid]=f;
  });
}

        '<div style="font-size:.78rem;margin-bottom:.5rem"><a style="color:#5c820d" target="_blank" rel="noopener" href="https://www.openstreetmap.org/?mlat='+map.lat+'&mlon='+map.lng+'#map=16/'+map.lat+'/'+map.lng+'">Agrandir la carte ↗</a></div>'+

        (function(){

          }

        (sol?('<div class="bio-block"><h3>🪨 Nature du sol</h3><p>'+esc(sol)+'</p></div>'):'')+

        (biox?('<div class="bio-block"><h3>🔬 Biologie</h3><p>'+esc(biox)+'</p></div>'):'')+

          '<li><strong>Pollinisateur :</strong> '+esc(pollin)+'</li>'+
          '<li><strong>Alimentation :</strong> '+esc(regime)+'</li>'+
          '<li><strong>Utilité :</strong> '+esc(utilite)+'</li>'+
        '</ul>'+
        
      '</div>'+
        (f.role_source?('<p class="statut-source" style="margin-top:.5rem">📚 D\'après <a href="'+(f.role_source.url||f.role_source.site||'https://jessica-joachim.com/')+'" target="_blank" rel="noopener" style="color:#5c820d">'+(f.role_source.name||'Jessica Joachim')+'</a> (avec autorisation)'+(f.jessica_url?(' · <a href="'+f.jessica_url+'" target="_blank" rel="noopener" style="color:#5c820d">fiche source ↗</a>'):'')+'</p>'):'')+
      '</div>'+
    '</div>'+
    '<div class="fiche-bottom fiche-bottom-single">'+
      '<div class="fiche-card"><h2>📅 Calendrier de vie</h2>'+phenoHTML(f.phenologie)+'</div>'+
    '</div>';
  bind();
}

function route(){
  const h=(location.hash||'#accueil').slice(1).split('/');
  const page=h[0], param=h[1];
  if(page==='explorer')return pageExplorer(param);
  if(page==='stats')return pageStats();
  if(page==='remarquables')return pageRemarquables();
  if(page==='jardin')return pageJardin();
  if(page==='espece')return pageEspece(param);
  return pageAccueil();
}




/* Lightbox galerie */
function openLightbox(src, alt){
  var lb=document.getElementById('lightbox');
  if(!lb){
    lb=document.createElement('div');
    lb.id='lightbox';
    lb.innerHTML='<div class="lb-backdrop"></div><div class="lb-content"><button class="lb-close" type="button">×</button><img class="lb-img" alt=""></div>';
    document.body.appendChild(lb);
    lb.querySelector('.lb-backdrop').onclick=lb.querySelector('.lb-close').onclick=function(){lb.classList.remove('open');};
    document.addEventListener('keydown', function(e){ if(e.key==='Escape') lb.classList.remove('open'); });
  }
  lb.querySelector('.lb-img').src=src;
  lb.querySelector('.lb-img').alt=alt||'';
  lb.classList.add('open');
}
document.addEventListener('click', function(e){
  var img=e.target.closest('.gallery-row img, .photo-feature img');
  if(img && img.dataset.full){ e.preventDefault(); openLightbox(img.dataset.full, img.title||''); }
});

async function boot(){
  const main=document.getElementById('app-main');
  try{
    // 1) embedded slim data (single HTML file)
    if(window.__SLIM_DATA__){
      DATA=window.__SLIM_DATA__;
      // Fiches personnelles : embedded first, then optional fetch
      if(window.__FICHES_PERSONNELLES__){
        applyFichesPersonnelles(window.__FICHES_PERSONNELLES__);
      } else if(location.protocol !== 'file:'){
        // Only try fetch when not opened as file:// (avoids Failed to fetch)
        try{
          const rp=await fetch('js/fiches-personnelles.json',{cache:'no-store'});
          if(rp.ok){ applyFichesPersonnelles(await rp.json()); }
        }catch(e){ /* silent when file:// or missing */ }
      }
    } else {
      // 2) folder mode (local server)
      if(window.__SLIM_DATA__){ DATA=window.__SLIM_DATA__; } else { const r=await fetch('js/data-slim.json',{cache:'no-store'});
      if(!r.ok) throw new Error('no data');
      DATA=await r.json(); }
      // Try personnelles
      try{
        const rp=await fetch('js/fiches-personnelles.json',{cache:'no-store'});
        if(rp.ok){ applyFichesPersonnelles(await rp.json()); }
      }catch(e){ /* optional file */ }
    }
    route();
    addEventListener('hashchange', route);
  }catch(e){
    main.innerHTML='<div class="empty"><p><strong>Impossible de charger les données.</strong></p><p>Ouvrez le site via un petit serveur local :</p><pre style="text-align:left;display:inline-block;background:#f4f8ef;padding:1rem;border-radius:8px">python3 -m http.server 8080</pre><p class="text-muted">Puis allez sur http://localhost:8080</p></div>';
  }
}
boot();
</script>
